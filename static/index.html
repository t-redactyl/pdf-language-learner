<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin — PDF language reader</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Margin home"><span>Margin</span><small>PDF language reader</small></a>
    <label class="file-button">Open PDF<input id="pdf-input" type="file" accept="application/pdf"></label>
  </header>
  <main>
    <section id="empty-state" class="empty-state">
      <div class="empty-mark">M</div>
      <p class="eyebrow">Read beyond your vocabulary</p>
      <h1>A quieter way to read<br>in another language.</h1>
      <p class="intro">Open a PDF, select any word or phrase, and translate it without leaving the page. Your document stays in your browser.</p>
      <label class="primary-button">Choose a PDF<input type="file" accept="application/pdf"></label>
    </section>
    <section id="reader" class="reader" hidden>
      <aside class="reader-meta">
        <p class="eyebrow">Now reading</p><h2 id="document-name"></h2><p id="page-count"></p>
        <button id="clear-highlights" class="text-button" type="button">Clear highlights</button>
      </aside>
      <div id="pages" class="pages" aria-label="PDF pages"></div>
      <aside class="translation-panel">
        <p class="eyebrow">Translation</p>
        <p id="selection-hint">Select text in the document to begin.</p>
        <div id="translation-content" hidden>
          <blockquote id="selected-text"></blockquote>
          <label for="target-language">Translate to</label>
          <select id="target-language">
            <option>English</option><option>German</option><option>Spanish</option><option>French</option>
            <option>Italian</option><option>Portuguese</option><option>Dutch</option><option>Polish</option>
            <option>Japanese</option><option>Korean</option><option>Chinese (Simplified)</option>
          </select>
          <button id="translate-button" class="primary-button" type="button">Translate selection</button>
          <div id="result" class="result" hidden><span id="detected-language"></span><p id="translated-text"></p></div>
          <p id="error" class="error" role="alert"></p>
        </div>
      </aside>
    </section>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
